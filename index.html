<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orca Studios</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #1A1A1A;
    color: #fff;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 520px; }
  .tiles { display: flex; gap: 8px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .tile {
    width: 52px; height: 52px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800; color: #fff;
  }
  .g { background: #4CAF50; } .y { background: #FBC02D; } .d { background: #333; }
  h1 { font-size: 2em; margin: 0 0 8px; }
  .sub { color: #9e9e9e; letter-spacing: 4px; font-size: 0.8em; margin-bottom: 36px; }
  .card {
    background: #242424; border: 1px solid #333; border-radius: 14px;
    padding: 24px; margin-bottom: 16px; text-align: left;
  }
  .card h2 { margin: 0 0 6px; font-size: 1.15em; }
  .card p { margin: 0 0 14px; color: #b5b5b5; font-size: 0.95em; line-height: 1.5; }
  .btn {
    display: inline-block; background: #4CAF50; color: #fff; text-decoration: none;
    padding: 10px 22px; border-radius: 8px; font-weight: 700; letter-spacing: 0.5px;
  }
  a.plain { color: #7cc4ff; }
  footer { margin-top: 32px; color: #666; font-size: 0.8em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tiles">
    <div class="tile g">P</div><div class="tile d">U</div><div class="tile y">R</div><div class="tile d">E</div><div class="tile d">W</div><div class="tile g">O</div><div class="tile d">R</div><div class="tile y">D</div>
  </div>
  <h1>Orca Studios</h1>
  <div class="sub">MOBILE GAMES</div>

  <div class="card">
    <h2>PureWord: Daily Guess</h2>
    <p>Crack the hidden word in six tries. A new daily puzzle, endless zen
    mode with rising difficulty, streaks, stats and shareable results.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.orcastudios.pureword">Get it on Google Play</a>
  </div>

  <div class="card">
    <h2>Privacy</h2>
    <p>Read the <a class="plain" href="privacy-policy.html">PureWord privacy
    policy</a>.</p>
  </div>

  <footer>&copy; 2026 Orca Studios</footer>
</div>
</body>
</html>
